<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pregunta 1</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="hoja_de_estilo.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>

function procesarFormulario() {

    const form = document.forms["formCompra"];

    const carnet = form.carnet.value.trim();
    const nombre = form.nombre.value.trim();
    const email = form.email.value.trim();
    const clave = form.clave.value;

    const pais = form.pais.value;
    const direccion1 = form.direccion1.value.trim();
    const ciudad = form.ciudad.value.trim();
    const codigoPostal = form.codigoPostal.value.trim();
    const telefono = form.telefono.value.trim();

    const envio =
    document.querySelector('input[name="envio"]:checked');

    const pago =
    document.querySelector('input[name="pago"]:checked');

    const regCarnet = /^\d+\s[A-Z]{2,}$/;

    const regNombre = /^[a-zA-Z]+$/;

    const regEmail =
    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    const regTelefono =
    /^\d{7,10}$/;

    const regCodigoPostal =
    /^\d{4,6}$/;

    const regClave =
    /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/;

    if (!regCarnet.test(carnet)) {
        Swal.fire(
            "Error",
            "Carnet inválido. Ejemplo válido: 456789 LP",
            "error"
        );
        return false;
    }

    if (!regNombre.test(nombre)) {
        Swal.fire(
            "Error",
            "El nombre solo debe contener letras.",
            "error"
        );
        return false;
    }

    if (!regClave.test(clave)) {
        Swal.fire(
            "Error",
            "La contraseña debe tener mínimo 8 caracteres, una mayúscula, una minúscula, un número y un carácter especial.",
            "error"
        );
        return false;
    }

    if (!regEmail.test(email)) {
        Swal.fire(
            "Error",
            "Correo electrónico inválido.",
            "error"
        );
        return false;
    }

    if (!pais) {
        Swal.fire(
            "Error",
            "Seleccione un país.",
            "error"
        );
        return false;
    }

    if (!direccion1) {
        Swal.fire(
            "Error",
            "Ingrese una dirección.",
            "error"
        );
        return false;
    }

    if (!ciudad) {
        Swal.fire(
            "Error",
            "Ingrese una ciudad.",
            "error"
        );
        return false;
    }

    if (!regCodigoPostal.test(codigoPostal)) {
        Swal.fire(
            "Error",
            "Código postal inválido.",
            "error"
        );
        return false;
    }

    if (!regTelefono.test(telefono)) {
        Swal.fire(
            "Error",
            "Teléfono inválido.",
            "error"
        );
        return false;
    }

    if (!envio) {
        Swal.fire(
            "Error",
            "Seleccione un método de envío.",
            "error"
        );
        return false;
    }

    if (!pago) {
        Swal.fire(
            "Error",
            "Seleccione un método de pago.",
            "error"
        );
        return false;
    }



    Swal.fire({
        title: "Datos Correctos",
        html: `
            <b>Carnet:</b> ${carnet}<br>
            <b>Nombre:</b> ${nombre}<br>
            <b>Correo:</b> ${email}<br>}
            <b>Contraseña:</b> ${clave}
            <b>País:</b> ${pais}<br>
            <b>Dirección:</b> ${direccion1}<br>
            <b>Ciudad:</b> ${ciudad}<br>
            <b>Código Postal:</b> ${codigoPostal}<br>
            <b>Teléfono:</b> ${telefono}<br>
            <b>Método de Envío:</b> ${envio.value}<br>
            <b>Método de Pago:</b> ${pago.value}<br>
            
        `,
        icon: "success",
        confirmButtonText: "Aceptar"
    });

    return false;
}

</script>


</head>

<body class="bg-black">

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-lg-6 col-md-8">

                <h3 class="text-center mb-4">
                    Formulario de Compra
                </h3>

                <form name="formCompra"
                    onsubmit="return procesarFormulario()"
                    class="producto"
                    novalidate>

                    <!-- CAMPOS ORIGINALES -->

                    <div class="mb-3">
                        <label class="form-label">
                            Carnet de identidad
                        </label>
                        <input type="text"
                            name="carnet"
                            class="form-control"
                            placeholder="Ej: 16373397 LP"
                            >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Nombre del cliente
                        </label>
                        <input type="text"
                            name="nombre"
                            class="form-control"
                            placeholder="Tu nombre"
                            >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Correo electrónico
                        </label>
                        <input type="text"
                            name="email"
                            class="form-control"
                            placeholder="juanito@gmail.com"
                            >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Contraseña
                        </label>
                        <input type="password"
                            name="clave"
                            class="form-control"
                            >
                    </div>

                    <!-- CAMPOS NUEVOS -->

                    <div class="mb-3">
                        <label class="form-label">
                            País
                        </label>
                        <select name="pais" class="form-control" required>
                            <option value="">Seleccione un país</option>
                            <option value="Bolivia">Bolivia</option>
                            <option value="Argentina">Argentina</option>
                            <option value="Chile">Chile</option>
                            <option value="Perú">Perú</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Dirección Línea 1
                        </label>
                        <input type="text"
                            name="direccion1"
                            class="form-control"
                            placeholder="Calle y número"
                            >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Dirección Línea 2
                        </label>
                        <input type="text"
                            name="direccion2"
                            class="form-control"
                            placeholder="Apartamento, bloque, referencia">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Ciudad
                        </label>
                        <input type="text"
                            name="ciudad"
                            class="form-control"
                            >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Código Postal
                        </label>
                        <input type="text"
                            name="codigoPostal"
                            class="form-control"
                            >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Teléfono
                        </label>
                        <input type="text"
                            name="telefono"
                            class="form-control"
                            placeholder="77777777"
                            >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Método de Envío
                        </label>
                        <div class="form-check text-start">
                            <input class="form-check-input"
                                type="radio"
                                name="envio"
                                value="Entrega a domicilio"
                                required>
                            <label class="form-check-label">
                                Entrega a domicilio
                            </label>
                        </div>
                        <div class="form-check text-start">
                            <input class="form-check-input"
                                type="radio"
                                name="envio"
                                value="Punto de recogida">
                            <label class="form-check-label">
                                Punto de recogida
                            </label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label ">
                            Método de Pago
                        </label>
                        <div class="form-check text-start">
                            <input class="form-check-input"
                                type="radio"
                                name="pago"
                                value="Tarjeta"
                                required>
                            <label class="form-check-label ">
                                Tarjeta de Crédito/Débito
                            </label>
                        </div>
                        <div class="form-check text-start">
                            <input class="form-check-input"
                                type="radio"
                                name="pago"
                                value="Transferencia">
                            <label class="form-check-label ">
                                Transferencia Bancaria
                            </label>
                        </div>
                        <div class="form-check text-start">
                            <input class="form-check-input"
                                type="radio"
                                name="pago"
                                value="QR">
                            <label class="form-check-label ">
                                Pago mediante QR
                            </label>
                        </div>
                    </div>

                        <div class="d-flex justify-content-between">
                            <button type="submit">
                                Enviar
                            </button>

                            <button type="button" onclick="window.location.href='index.html'">
                                Volver
                            </button>
                        </div>

                </form>
            </div>

        </div>

    </div>

</body>

</html>
